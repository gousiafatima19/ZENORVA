<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Recipe placeholder image">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123C2F"/>
      <stop offset="100%" stop-color="#0B2D23"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <g transform="translate(300,180)">
    <!-- Plate -->
    <ellipse cx="0" cy="30" rx="90" ry="20" fill="none" stroke="#D4AF57" stroke-width="3" opacity="0.5"/>
    <!-- Fork -->
    <path d="M-70 -50 L-70 20 M-78 -50 L-78 -20 M-70 -50 L-70 -20 M-62 -50 L-62 -20"
          stroke="#D4AF57" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-78" y="20" width="16" height="40" rx="2" fill="#D4AF57"/>
    <!-- Knife -->
    <path d="M70 -60 L70 60" stroke="#D4AF57" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 -60 Q80 -40 75 -10 L70 -10 Z" fill="#D4AF57"/>
    <!-- Leaf accent -->
    <path d="M0 -60 Q -20 -80 -30 -100 Q -10 -95 0 -80 Q 10 -95 30 -100 Q 20 -80 0 -60 Z"
          fill="#D4AF57" opacity="0.85"/>
  </g>
  <text x="300" y="330" text-anchor="middle"
        font-family="Georgia, serif" font-size="26" font-weight="700"
        fill="#D4AF57" letter-spacing="3">RECIPE</text>
  <text x="300" y="360" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-size="13"
        fill="rgba(220, 232, 220, 0.75)" letter-spacing="1">image coming soon</text>
</svg>